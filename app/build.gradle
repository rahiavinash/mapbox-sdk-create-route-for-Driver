apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.mapbox.maps.token'
apply from: "${rootDir}/gradle/script-git-version.gradle"
apply from: "${rootDir}/gradle/ktlint.gradle"
apply plugin: 'com.google.gms.google-services'

android {
    compileSdkVersion 35
    namespace 'com.solvay'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.solvay"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode gitNumberOfCommits
        versionName gitTagDescription
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        vectorDrawables.useSupportLibrary = true
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildTypes {
        debug {
            buildConfigField("String", "BASE_URL", BASE_URL)
            buildConfigField("String", "IMAGE_URL", IMAGE_URL)
            buildConfigField("String", "TRANSLATION_KEY", TRANSLATION_KEY)
            testCoverageEnabled = false
            manifestPlaceholders = [enableCrashReporting: "false"]
        }
        release {
            buildConfigField("String", "BASE_URL", BASE_URL)
            buildConfigField("String", "IMAGE_URL", IMAGE_URL)
            buildConfigField("String", "TRANSLATION_KEY", TRANSLATION_KEY)
            minifyEnabled true
            manifestPlaceholders = [enableCrashReporting: "true"]
        }
    }

    lintOptions {
        abortOnError false
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    sourceSets {
        main {
            res.srcDirs = [
                    'src/main/res',
                    'src/main/java/com/mapbox/navigation/examples/dropinui/res',
                    'src/main/java/com/mapbox/navigation/examples/standalone/res',
            ]

            def standaloneDirs = file("$projectDir/src/main/java/com/mapbox/navigation/examples/standalone")
                    .listFiles({ it.isDirectory() } as FileFilter)
                    .collect { it.name }
            standaloneDirs.forEach {
                res.srcDirs += 'src/main/java/com/mapbox/navigation/examples/standalone/' + it + '/res'
            }

            def dropInUIDirs = file("$projectDir/src/main/java/com/mapbox/navigation/examples/dropinui")
                    .listFiles({ it.isDirectory() } as FileFilter)
                    .collect { it.name }
            dropInUIDirs.forEach {
                res.srcDirs += 'src/main/java/com/mapbox/navigation/examples/dropinui/' + it + '/res'
            }
        }
    }

}

dependencies {
    // Mapbox Navigation SDK
    implementation "com.mapbox.navigationcore:navigation:3.7.3"
    implementation "com.mapbox.navigationcore:ui-components:3.7.3"
    implementation "androidx.compose.ui:ui:1.5.4"
    implementation "androidx.compose.material:material:1.5.4"
    implementation "androidx.compose.ui:ui-tooling-preview:1.5.4"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.21"
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "com.google.android.material:material:1.7.0"
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation "androidx.appcompat:appcompat:1.5.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
//    implementation "com.squareup.leakcanary:leakcanary-android:2.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
    implementation("com.google.android.gms:play-services-location:21.0.1")
    implementation 'androidx.activity:activity:1.10.1'

    // Fragment support
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'
